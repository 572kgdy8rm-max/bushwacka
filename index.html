<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhaleWatch • Ben's Quant</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --text: #e0e0e0;
      --accent: #00ff9d;
      --red: #ff3b5c;
    }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    h1 { margin: 0; font-size: 1.8rem; font-weight: 700; }
    .subtitle { color: #888; font-size: 0.95rem; margin-top: 4px; }

    .container { padding: 20px; max-width: 600px; margin: 0 auto; }

    .search {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      color: white;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #222;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ticker { font-size: 1.8rem; font-weight: 700; }
    .price { font-size: 1.4rem; color: var(--accent); }

    .conviction {
      font-size: 2.8rem;
      font-weight: 800;
      text-align: center;
      margin: 10px 0;
    }

    .rec {
      font-size: 1.3rem;
      text-align: center;
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-block;
      margin: 10px 0;
    }

    .strong { background: #00ff9d22; color: #00ff9d; }
    .buy { background: #00cc7722; color: #00cc77; }
    .small { background: #ffaa0022; color: #ffaa00; }
    .avoid { background: #ff3b5c22; color: #ff3b5c; }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .metric { text-align: center; }
    .metric-label { font-size: 0.8rem; color: #888; }
    .metric-value { font-size: 1.1rem; font-weight: 600; }

    button {
      background: var(--accent);
      color: black;
      border: none;
      padding: 14px;
      font-weight: 700;
      border-radius: 12px;
      width: 100%;
      font-size: 1.1rem;
      margin-top: 10px;
    }
    .loading { text-align: center; color: #666; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>🐋 WHALEWATCH</h1>
    <p class="subtitle">Ben's Personal Quant Supercomputer</p>
  </header>

  <div class="container">
    <input type="text" id="tickerInput" class="search" placeholder="Enter ticker (e.g. NVDA)" onkeypress="if(event.key==='Enter') analyzeTicker()">

    <button onclick="analyzeTicker()">ANALYZE TICKER</button>

    <div id="result" class="card" style="display:none;"></div>

    <h2 style="margin: 30px 0 15px 5px;">Today's Top Conviction Picks</h2>
    <div id="topPicks" class="loading">Loading market signals...</div>
  </div>

  <script>
    const API_BASE = "https://bushwacka.onrender.com";

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Failed to fetch");
      return res.json();
    }

    async function analyzeTicker() {
      let ticker = document.getElementById("tickerInput").value.trim().toUpperCase();
      if (!ticker) return;

      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<div class="loading">Analyzing ${ticker}...</div>`;

      try {
        const data = await fetchJSON(`${API_BASE}/signal/${ticker}`);

        let html = `
          <div class="top-bar">
            <div>
              <div class="ticker">${data.ticker}</div>
              <div class="price">$${data.current_price}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:0.9rem;color:#888">Conviction</div>
              <div class="conviction">${data.conviction}</div>
            </div>
          </div>

          <div class="rec ${data.conviction >= 85 ? 'strong' : data.conviction >= 70 ? 'buy' : data.conviction >= 55 ? 'small' : 'avoid'}">
            ${data.recommendation}
          </div>

          <p><strong>Position:</strong> ${data.position_pct}% of portfolio • ${data.risk_level} risk</p>

          <div class="metrics">
            <div class="metric">
              <div class="metric-label">Wilson Score</div>
              <div class="metric-value">${data.wilson_score}</div>
            </div>
            <div class="metric">
              <div class="metric-label">Win Rate vs SPY</div>
              <div class="metric-value">${data.win_rate}%</div>
            </div>
            <div class="metric">
              <div class="metric-label">Sharpe Ratio</div>
              <div class="metric-value">${data.sharpe}</div>
            </div>
            <div class="metric">
              <div class="metric-label">Max Drawdown</div>
              <div class="metric-value">${data.max_drawdown}%</div>
            </div>
          </div>
        `;
        resultDiv.innerHTML = html;
      } catch (e) {
        resultDiv.innerHTML = `<p style="color:#ff3b5c;text-align:center">Could not analyze ${ticker}. Try again later.</p>`;
      }
    }

    async function loadTopPicks() {
      const container = document.getElementById("topPicks");
      try {
        const data = await fetchJSON(`${API_BASE}/top`);
        let html = '';

        data.top.forEach(stock => {
          html += `
            <div class="card" onclick="quickAnalyze('${stock.ticker}')">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                  <strong>${stock.ticker}</strong><br>
                  <small>$${stock.current_price}</small>
                </div>
                <div style="text-align:right">
                  <div style="font-size:1.8rem;font-weight:800;color:${stock.conviction > 70 ? '#00ff9d' : '#ffaa00'}">
                    ${stock.conviction}
                  </div>
                  <small>conviction</small>
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = `<p style="color:#888">Failed to load top picks. Check backend.</p>`;
      }
    }

    function quickAnalyze(ticker) {
      document.getElementById("tickerInput").value = ticker;
      analyzeTicker();
      window.scrollTo(0, 0);
    }

    // Load on start
    loadTopPicks();
  </script>
</body>
</html>
