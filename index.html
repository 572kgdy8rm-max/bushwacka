<script>
const API = 'https://bushwacka.onrender.com';

function color(v){
  if(v>=80) return 'var(--green)';
  if(v>=65) return 'var(--amber)';
  if(v>=45) return 'var(--white)';
  return 'var(--red)';
}

async function analyze(){
  const t = document.getElementById('ti').value.toUpperCase();

  const r = await fetch(API+'/signal/'+t);
  const d = await r.json();

  const opt = d.options;

  document.getElementById('res').innerHTML = `
    <div>
      <h2 style="color:${color(d.conviction)}">${d.ticker}</h2>
      <div>Conviction: ${d.conviction}</div>
      <div>Verdict: ${d.verdict}</div>
      <div>Entry: ${d.entry_flag}</div>

      <hr>

      <div>OPTIONS</div>
      <div>Trade: ${opt.trade}</div>
      <div>Direction: ${opt.direction || 'NONE'}</div>
      <div>Structure: ${opt.structure || '-'}</div>
      <div>Strike: ${opt.strike || '-'}</div>
      <div>Expiry: ${opt.expiry || '-'}</div>
      <div>IV: ${opt.iv_regime || '-'}</div>
    </div>
  `;
}
</script>
