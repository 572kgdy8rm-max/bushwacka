<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhaleWatch • Ben's Quant</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    :root { --bg: #0a0a0a; --card: #111; --accent: #00ff9d; }
    body { margin:0; padding:0; font-family: -apple-system, sans-serif; background:var(--bg); color:#e0e0e0; }
    header { background:#000; padding:20px; text-align:center; }
    .container { padding:20px; max-width:620px; margin:0 auto; }
    .search { width:100%; padding:16px; font-size:1.1rem; background:#1a1a1a; border:1px solid #333; border-radius:12px; color:white; }
    button { background:#00ff9d; color:black; border:none; padding:16px; font-weight:700; border-radius:12px; width:100%; margin:10px 0; }
    .card { background:var(--card); border-radius:16px; padding:20px; margin:20px 0; border:1px solid #222; }
    .ticker { font-size:1.9rem; font-weight:700; }
    .price { color:var(--accent); font-size:1.5rem; }
    .conviction { font-size:3rem; font-weight:800; text-align:right; }
    .rec { padding:10px 18px; border-radius:999px; text-align:center; font-size:1.25rem; margin:12px 0; }
    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
    .metric-label { font-size:0.85rem; color:#888; }
    .metric-value { font-size:1.15rem; font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h1>🐋 WHALEWATCH</h1>
    <p>Ben's Personal Quant Supercomputer</p>
  </header>

  <div class="container">
    <input type="text" id="tickerInput" class="search" placeholder="Enter ticker (NVDA, RKLB...)" onkeypress="if(event.key==='Enter') analyzeTicker()">
    <button onclick="analyzeTicker()">ANALYZE TICKER</button>

    <div id="result" class="card" style="display:none;"></div>

    <h2 style="margin:30px 0 15px 5px;">Today's Top Conviction Picks</h2>
    <div id="topPicks" class="loading">Loading...</div>
  </div>

  <script>
    const API_BASE = "https://bushwacka.onrender.com";

    async function fetchJSON(url) { 
      const r = await fetch(url); 
      if (!r.ok) throw new Error(); 
      return r.json(); 
    }

    async function analyzeTicker() {
      let t = document.getElementById("tickerInput").value.trim().toUpperCase();
      if (!t) return;
      const div = document.getElementById("result");
      div.style.display = "block";
      div.innerHTML = `<div style="text-align:center;padding:40px;color:#666">Analyzing ${t}...</div>`;

      try {
        const d = await fetchJSON(`${API_BASE}/signal/${t}`);
        let html = `
          <div style="display:flex;justify-content:space-between">
            <div><span class="ticker">${d.ticker}</span><br><span class="price">$${d.current_price}</span></div>
            <div><span style="font-size:0.9rem;color:#888">Conviction</span><br><span class="conviction">${d.conviction}</span></div>
          </div>
          <div class="rec" style="background:${d.conviction>=82?'#00ff9d22':d.conviction>=72?'#00cc7722':'#ffaa0022'};color:${d.conviction>=72?'#00ff9d':'#ffaa00'}">
            ${d.recommendation}
          </div>
          <p><strong>Position:</strong> ${d.position_pct}% • ${d.risk_level}</p>
          
          <div class="metrics">
            <div><div class="metric-label">Wilson</div><div class="metric-value">${d.wilson_score}</div></div>
            <div><div class="metric-label">Win Rate vs SPY</div><div class="metric-value">${d.win_rate}%</div></div>
            <div><div class="metric-label">Sharpe</div><div class="metric-value">${d.sharpe}</div></div>
            <div><div class="metric-label">Max DD</div><div class="metric-value">${d.max_drawdown}%</div></div>
          </div>

          <div style="margin-top:20px;background:#1a1a1a;padding:15px;border-radius:12px">
            <strong>1-Year Projection:</strong> $${d.projected_1yr_price} (${d.projected_1yr_gain_pct}%)<br>
            <strong>Analyst Upside:</strong> ${d.analyst_target_upside ? d.analyst_target_upside + '%' : 'N/A'}<br>
            <strong>Alt Data:</strong> ${d.alt_data_note}
          </div>
        `;
        div.innerHTML = html;
      } catch(e) {
        div.innerHTML = `<p style="color:#ff3b5c">Failed to load ${t}</p>`;
      }
    }

    async function loadTopPicks() {
      // ... (same as before, you can keep the old one or I can expand it)
      document.getElementById("topPicks").innerHTML = "<p>Top picks loading... (refresh if needed)</p>";
    }

    loadTopPicks();
  </script>
</body>
</html>
