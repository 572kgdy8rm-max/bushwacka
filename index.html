<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060609">
<title>WhaleWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:    #060609;
  --ink2:   #0d0d14;
  --ink3:   #13131e;
  --ink4:   #1a1a28;
  --wire:   rgba(255,255,255,0.06);
  --wire2:  rgba(255,255,255,0.11);
  --lime:   #b8ff5a;
  --lime2:  #8fcc3a;
  --cyan:   #5af0ff;
  --amber:  #ffcc44;
  --rose:   #ff4d6a;
  --fog:    #6b7a9a;
  --mist:   #9aaabb;
  --snow:   #ddeeff;
  --mono:   'IBM Plex Mono', monospace;
  --sans:   'IBM Plex Sans', sans-serif;
}

html,body{height:100%;overflow-x:hidden}

body{
  font-family:var(--sans);
  background:var(--ink);
  color:var(--snow);
  min-height:100%;
}

/* grid overlay */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(184,255,90,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(184,255,90,0.025) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;z-index:0;
}

/* top glow */
body::after{
  content:'';position:fixed;top:-120px;left:50%;transform:translateX(-50%);
  width:600px;height:300px;
  background:radial-gradient(ellipse,rgba(184,255,90,0.07) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(6,6,9,0.96);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--wire2);
  height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
}

.logo{display:flex;align-items:center;gap:10px}

.logo-mark{
  width:28px;height:28px;
  background:var(--lime);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  box-shadow:0 0 16px rgba(184,255,90,0.4);
  flex-shrink:0;
}

.logo-text{
  font-family:var(--mono);
  font-size:0.82rem;font-weight:700;
  letter-spacing:0.2em;color:var(--snow);
}

.logo-sub{
  font-family:var(--mono);
  font-size:0.5rem;color:var(--fog);
  letter-spacing:0.15em;margin-top:1px;
}

.hdr-right{display:flex;align-items:center;gap:10px}

.pulse-badge{
  display:flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:0.55rem;
  color:var(--lime);letter-spacing:0.1em;
  background:rgba(184,255,90,0.08);
  border:1px solid rgba(184,255,90,0.2);
  padding:4px 9px;border-radius:3px;
}

.pulse-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--lime);
  box-shadow:0 0 6px var(--lime);
  animation:blink 1.4s ease infinite;
}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.refresh-btn{
  font-family:var(--mono);font-size:0.55rem;
  color:var(--fog);letter-spacing:0.1em;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--wire2);
  padding:4px 9px;border-radius:3px;
  cursor:pointer;transition:all .15s;
}

.refresh-btn:hover{color:var(--lime);border-color:rgba(184,255,90,0.3)}

/* ── TABS ── */
nav{
  display:flex;
  background:var(--ink2);
  border-bottom:1px solid var(--wire);
  padding:0 18px;
  position:sticky;top:52px;z-index:199;
}

.tab{
  padding:12px 16px;
  font-family:var(--mono);font-size:0.65rem;font-weight:500;
  letter-spacing:0.15em;color:var(--fog);
  background:none;border:none;cursor:pointer;
  transition:color .2s;position:relative;
}

.tab::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:2px;background:var(--lime);border-radius:2px 2px 0 0;
  transform:scaleX(0);transition:transform .2s;
}

.tab.on{color:var(--lime)}
.tab.on::after{transform:scaleX(1)}

/* ── PAGES ── */
.pg{display:none}
.pg.on{display:block}

/* ── WRAP ── */
.w{
  max-width:580px;margin:0 auto;
  padding:18px 16px 60px;
  position:relative;z-index:1;
}

/* ── SEARCH ── */
.srow{display:flex;gap:8px;margin-bottom:20px}

.tinput{
  flex:1;height:50px;
  padding:0 16px;
  font-family:var(--mono);font-size:1rem;font-weight:600;
  letter-spacing:0.15em;text-transform:uppercase;
  background:var(--ink3);
  border:1px solid var(--wire2);border-radius:4px;
  color:var(--snow);outline:none;
  transition:border-color .2s,box-shadow .2s;
}

.tinput::placeholder{
  color:var(--fog);font-weight:300;
  letter-spacing:0.05em;text-transform:none;
}

.tinput:focus{
  border-color:rgba(184,255,90,.5);
  box-shadow:0 0 0 3px rgba(184,255,90,.07);
}

.gbtn{
  height:50px;padding:0 20px;
  font-family:var(--mono);font-size:0.7rem;font-weight:700;
  letter-spacing:0.15em;
  background:var(--lime);color:#050505;
  border:none;border-radius:4px;cursor:pointer;
  transition:all .15s;
  box-shadow:0 0 20px rgba(184,255,90,.2);
  flex-shrink:0;
}

.gbtn:hover{background:#ccff77;box-shadow:0 0 28px rgba(184,255,90,.35);transform:translateY(-1px)}
.gbtn:active{transform:translateY(0)}

/* ── RESULT ── */
.result{display:none;animation:up .3s cubic-bezier(.16,1,.3,1)}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── TICKER HERO ── */
.hero{
  background:var(--ink3);
  border:1px solid var(--wire2);
  border-radius:6px;
  padding:22px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
}

.hero-glow{
  position:absolute;top:-80px;right:-80px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(184,255,90,.08),transparent 70%);
  pointer-events:none;
}

.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}

.ht-left{}
.h-ticker{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.h-price{font-family:var(--mono);font-size:1.1rem;color:var(--lime);margin-top:5px}

.ht-right{text-align:right}
.cv-label{font-family:var(--mono);font-size:.5rem;color:var(--fog);letter-spacing:.15em;text-transform:uppercase}
.cv-num{font-family:var(--mono);font-size:4rem;font-weight:700;letter-spacing:-.04em;line-height:1}

/* conviction bar */
.cbar{height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;margin-bottom:18px}
.cbar-fill{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.16,1,.3,1)}

/* verdict pill */
.verdict{
  display:flex;align-items:center;justify-content:center;
  padding:13px;border-radius:4px;
  font-family:var(--mono);font-size:.85rem;font-weight:700;
  letter-spacing:.12em;margin-bottom:14px;
}

/* entry flag */
.entry-flag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:.6rem;font-weight:500;
  letter-spacing:.1em;padding:5px 10px;border-radius:3px;
  margin-bottom:14px;
}

/* ── CATEGORY SCORES ── */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

.cat-box{
  background:var(--ink4);
  border:1px solid var(--wire);
  border-radius:5px;
  padding:14px;
}

.cat-name{
  font-family:var(--mono);font-size:.55rem;
  color:var(--fog);letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:8px;
}

.cat-score{
  font-family:var(--mono);font-size:1.8rem;font-weight:700;
  letter-spacing:-.02em;line-height:1;margin-bottom:6px;
}

.cat-bar{height:2px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.16,1,.3,1)}

/* ── SECTION CARD ── */
.card{
  background:var(--ink3);
  border:1px solid var(--wire);
  border-radius:6px;
  padding:18px;
  margin-bottom:10px;
}

.card-title{
  font-family:var(--mono);font-size:.55rem;
  color:var(--fog);letter-spacing:.15em;text-transform:uppercase;
  margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}

.card-title::after{content:'';flex:1;height:1px;background:var(--wire)}

/* ── METRIC ROWS ── */
.metric-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03);
}

.metric-row:last-child{border-bottom:none;padding-bottom:0}
.metric-row:first-child{padding-top:0}

.mr-name{
  font-family:var(--mono);font-size:.72rem;color:var(--mist);
  flex:1;
}

.mr-raw{
  font-family:var(--mono);font-size:.65rem;color:var(--fog);
  width:64px;text-align:right;
}

.mr-bar{
  width:60px;height:4px;
  background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;
  flex-shrink:0;
}

.mr-bar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.16,1,.3,1)}

.mr-score{
  font-family:var(--mono);font-size:.8rem;font-weight:600;
  width:28px;text-align:right;flex-shrink:0;
}

/* ── WARNINGS ── */
.warning-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;
  background:rgba(255,77,106,.05);
  border:1px solid rgba(255,77,106,.15);
  border-radius:4px;
  margin-bottom:6px;
  font-size:.8rem;line-height:1.4;
  color:var(--mist);
}

.warning-item:last-child{margin-bottom:0}

/* ── PICKS ── */
.pick{
  background:var(--ink3);border:1px solid var(--wire);
  border-radius:5px;padding:16px;
  margin-bottom:8px;
  display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:all .2s;
  animation:up .3s cubic-bezier(.16,1,.3,1) both;
  position:relative;overflow:hidden;
}

.pick:hover{border-color:var(--wire2);background:var(--ink4);transform:translateX(4px)}

.pick-rank{font-family:var(--mono);font-size:.6rem;color:var(--fog);width:20px;flex-shrink:0}
.pick-info{flex:1}
.pick-ticker{font-size:1rem;font-weight:700;font-family:var(--mono)}
.pick-price{font-family:var(--mono);font-size:.65rem;color:var(--fog);margin-top:2px}
.pick-verdict{font-family:var(--mono);font-size:.6rem;color:var(--mist);margin-top:4px}
.pick-pct{font-family:var(--mono);font-size:.58rem;color:var(--fog);margin-top:2px}

.pick-right{text-align:right;flex-shrink:0}
.pick-cv{font-family:var(--mono);font-size:1.9rem;font-weight:700;line-height:1}
.pick-label{font-family:var(--mono);font-size:.5rem;color:var(--fog);letter-spacing:.1em}

.pick-stripe{position:absolute;bottom:0;left:0;height:2px;transition:width 1s cubic-bezier(.16,1,.3,1)}

/* ── SCAN ── */
.sinput{
  width:100%;padding:13px 16px;
  font-family:var(--mono);font-size:.8rem;
  letter-spacing:.1em;text-transform:uppercase;
  background:var(--ink3);border:1px solid var(--wire2);
  border-radius:4px;color:var(--snow);outline:none;
  margin-bottom:8px;transition:border-color .2s;
}

.sinput::placeholder{color:var(--fog);text-transform:none;letter-spacing:0}
.sinput:focus{border-color:rgba(90,240,255,.4);box-shadow:0 0 0 3px rgba(90,240,255,.06)}

.sbtn{
  width:100%;height:46px;
  font-family:var(--mono);font-size:.7rem;font-weight:700;
  letter-spacing:.15em;
  background:var(--cyan);color:#050505;
  border:none;border-radius:4px;cursor:pointer;
  transition:all .15s;box-shadow:0 0 20px rgba(90,240,255,.15);
  margin-bottom:18px;
}

.sbtn:hover{background:#88f8ff;box-shadow:0 0 28px rgba(90,240,255,.25);transform:translateY(-1px)}

.stable-wrap{background:var(--ink3);border:1px solid var(--wire);border-radius:5px;overflow:hidden}

table{width:100%;border-collapse:collapse}

thead th{
  font-family:var(--mono);font-size:.52rem;color:var(--fog);
  letter-spacing:.12em;text-transform:uppercase;
  padding:10px 12px;text-align:left;
  background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--wire);
}

tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover td{background:rgba(255,255,255,.025)}
tbody td{
  padding:12px 12px;
  font-family:var(--mono);font-size:.72rem;
  border-bottom:1px solid rgba(255,255,255,.03);
}
tbody tr:last-child td{border-bottom:none}

/* ── LOADING / ERROR ── */
.loading{
  text-align:center;padding:48px 20px;
  font-family:var(--mono);font-size:.7rem;
  color:var(--fog);letter-spacing:.12em;
}

.spinner{
  width:28px;height:28px;
  border:2px solid var(--wire2);
  border-top-color:var(--lime);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 14px;
}

@keyframes spin{to{transform:rotate(360deg)}}

.err{
  text-align:center;padding:32px;
  font-family:var(--mono);font-size:.7rem;
  color:var(--rose);letter-spacing:.05em;line-height:1.7;
}

/* ── SECTION TITLE ── */
.sec-hd{
  font-family:var(--mono);font-size:.6rem;
  color:var(--fog);letter-spacing:.15em;text-transform:uppercase;
  margin:0 0 12px;
  display:flex;align-items:center;gap:8px;
}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--wire)}

/* refresh status */
.refresh-status{
  font-family:var(--mono);font-size:.58rem;
  color:var(--fog);letter-spacing:.08em;
  text-align:center;padding:10px 0 4px;
}

/* ── UTILS ── */
.lime{color:var(--lime)}
.cyan{color:var(--cyan)}
.amb{color:var(--amber)}
.rose{color:var(--rose)}
.fog{color:var(--fog)}
.mist{color:var(--mist)}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">🐋</div>
    <div>
      <div class="logo-text">WHALEWATCH</div>
      <div class="logo-sub">PURE QUANT ENGINE</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="refresh-btn" onclick="manualRefresh()">↻ REFRESH BASKET</button>
    <div class="pulse-badge"><div class="pulse-dot"></div>LIVE</div>
  </div>
</header>

<nav>
  <button class="tab on" onclick="go('analyze')">ANALYZE</button>
  <button class="tab"    onclick="go('picks')">TOP PICKS</button>
  <button class="tab"    onclick="go('scan')">SCAN</button>
</nav>

<!-- ANALYZE -->
<div class="pg on" id="pg-analyze">
  <div class="w">
    <div class="srow">
      <input class="tinput" id="ti" placeholder="Ticker symbol…" maxlength="10"
        onkeypress="if(event.key==='Enter')analyze()">
      <button class="gbtn" onclick="analyze()">ANALYZE</button>
    </div>
    <div class="result" id="res"></div>
  </div>
</div>

<!-- TOP PICKS -->
<div class="pg" id="pg-picks">
  <div class="w">
    <div id="pks"><div class="loading"><div class="spinner"></div>Loading signals…</div></div>
  </div>
</div>

<!-- SCAN -->
<div class="pg" id="pg-scan">
  <div class="w">
    <div class="sec-hd">BULK SCANNER</div>
    <input class="sinput" id="si" placeholder="NVDA, TSLA, AAPL, RKLB…"
      onkeypress="if(event.key==='Enter')scan()">
    <button class="sbtn" onclick="scan()">RUN SCAN</button>
    <div id="sout"></div>
  </div>
</div>

<script>
const API = 'https://bushwacka.onrender.com';

// ── TABS ──
function go(t){
  ['analyze','picks','scan'].forEach((id,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('on',id===t);
    document.getElementById('pg-'+id).classList.toggle('on',id===t);
  });
  if(t==='picks'&&!document.querySelector('.pick')) loadPicks();
}

// ── COLOR ──
function cc(c){
  if(c>=80) return 'var(--lime)';
  if(c>=65) return 'var(--cyan)';
  if(c>=45) return 'var(--amber)';
  if(c>=30) return '#ff8855';
  return 'var(--rose)';
}

function cg(c){
  if(c>=80) return 'linear-gradient(90deg,#b8ff5a,#8fcc3a)';
  if(c>=65) return 'linear-gradient(90deg,#5af0ff,#2299cc)';
  if(c>=45) return 'linear-gradient(90deg,#ffcc44,#cc8800)';
  if(c>=30) return 'linear-gradient(90deg,#ff8855,#cc4422)';
  return 'linear-gradient(90deg,#ff4d6a,#cc1133)';
}

function sc(s){
  if(s>=8) return 'var(--lime)';
  if(s>=6) return '#aadd66';
  if(s>=4) return 'var(--amber)';
  if(s>=2) return '#ff8855';
  return 'var(--rose)';
}

function vs(v){
  const m={
    'Strong Buy': {bg:'rgba(184,255,90,.1)',  border:'rgba(184,255,90,.3)',  col:'var(--lime)'},
    'Buy':        {bg:'rgba(90,240,255,.08)', border:'rgba(90,240,255,.2)',  col:'var(--cyan)'},
    'Neutral':    {bg:'rgba(255,204,68,.07)', border:'rgba(255,204,68,.2)',  col:'var(--amber)'},
    'Sell':       {bg:'rgba(255,136,85,.07)', border:'rgba(255,136,85,.2)',  col:'#ff8855'},
    'Strong Sell':{bg:'rgba(255,77,106,.08)', border:'rgba(255,77,106,.25)', col:'var(--rose)'},
  };
  return m[v]||m['Neutral'];
}

function ef(flag){
  if(flag==='Good Entry')      return {bg:'rgba(184,255,90,.08)',border:'rgba(184,255,90,.2)',col:'var(--lime)',icon:'✓'};
  if(flag==='Wait for Pullback') return {bg:'rgba(255,204,68,.07)',border:'rgba(255,204,68,.2)',col:'var(--amber)',icon:'⏳'};
  return {bg:'rgba(90,240,255,.07)',border:'rgba(90,240,255,.2)',col:'var(--cyan)',icon:'↗'};
}

function sgn(n){return n>=0?'+':''}

// ── METRIC BAR ──
function mbar(score){
  return `<div class="mr-bar"><div class="mr-bar-fill" style="width:${score*10}%;background:${sc(score)}"></div></div>`;
}

// ── RENDER METRICS SECTION ──
function metricsSection(title, metrics, raws){
  const rawMap = {
    'RSI':              raws.rsi+'',
    'MACD':             raws.macd_hist+'',
    'Rate of Change':   raws.roc_pct+'%',
    'OBV Trend':        '—',
    '20d Momentum':     raws.mom_20d_pct+'%',
    'vs MA50':          '$'+raws.ma50,
    'vs MA200':         '$'+raws.ma200,
    'MA Cross':         raws.ma50>raws.ma200?'Golden':'Death',
    'ADX Strength':     raws.adx+'',
    '52w Range':        '$'+raws['52w_low']+'–'+raws['52w_high'],
    'Sharpe (1yr)':     raws.sharpe+'',
    'Sortino (1yr)':    raws.sortino+'',
    'Max Drawdown':     raws.max_dd_pct+'%',
    'Volatility':       raws.vol_pct+'%',
    'Beta vs SPY':      raws.beta+'',
    'Alpha 3m':         sgn(raws.alpha_3m)+raws.alpha_3m+'%',
    'Alpha 6m':         sgn(raws.alpha_6m)+raws.alpha_6m+'%',
    'Alpha 1yr':        sgn(raws.alpha_1y)+raws.alpha_1y+'%',
    'Excess Consistency':'—',
    'Win Rate vs SPY':  raws.win_rate+'%',
  };
  const rows = Object.entries(metrics).map(([k,v])=>`
    <div class="metric-row">
      <div class="mr-name">${k}</div>
      <div class="mr-raw fog">${rawMap[k]||'—'}</div>
      ${mbar(v)}
      <div class="mr-score" style="color:${sc(v)}">${v}</div>
    </div>`).join('');
  return `<div class="card">
    <div class="card-title">${title}</div>
    ${rows}
  </div>`;
}

// ── RENDER FULL RESULT ──
function renderResult(d){
  const col = cc(d.conviction);
  const vst = vs(d.verdict);
  const efs = ef(d.entry_flag);

  const cats = [
    {name:'MOMENTUM', score:d.momentum_score, key:'momentum'},
    {name:'TREND',    score:d.trend_score,    key:'trend'},
    {name:'RISK',     score:d.risk_score,     key:'risk'},
    {name:'REL STR',  score:d.rs_score,       key:'rs'},
  ];

  const catBoxes = cats.map(c=>`
    <div class="cat-box">
      <div class="cat-name">${c.name}</div>
      <div class="cat-score" style="color:${cc(c.score)}">${c.score}</div>
      <div class="cat-bar"><div class="cat-bar-fill" style="width:${c.score}%;background:${cg(c.score)}"></div></div>
    </div>`).join('');

  const warnings = (d.warnings||[]).map(w=>`
    <div class="warning-item">${w}</div>`).join('');

  const metricSections = Object.entries(d.metrics).map(([cat,metrics])=>
    metricsSection(cat, metrics, d.raw)
  ).join('');

  const pct = d.percentile!=null ? `<div class="entry-flag" style="background:rgba(255,255,255,.04);border:1px solid var(--wire2);color:var(--fog)">BEATS ${d.percentile}% OF S&P BASKET</div>` : '';

  return `
  <div class="hero">
    <div class="hero-glow"></div>
    <div class="hero-top">
      <div class="ht-left">
        <div class="h-ticker">${d.ticker}</div>
        <div class="h-price">$${d.price.toLocaleString()}</div>
      </div>
      <div class="ht-right">
        <div class="cv-label">CONVICTION</div>
        <div class="cv-num" style="color:${col}">${d.conviction}</div>
      </div>
    </div>
    <div class="cbar"><div class="cbar-fill" style="width:${d.conviction}%;background:${cg(d.conviction)}"></div></div>
    <div class="verdict" style="background:${vst.bg};border:1px solid ${vst.border};color:${vst.col}">${d.verdict.toUpperCase()}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div class="entry-flag" style="background:${efs.bg};border:1px solid ${efs.border};color:${efs.col}">${efs.icon} ${d.entry_flag.toUpperCase()}</div>
      ${pct}
    </div>
  </div>

  <div class="card">
    <div class="card-title">CATEGORY SCORES</div>
    <div class="cats">${catBoxes}</div>
  </div>

  ${warnings ? `<div class="card">
    <div class="card-title">WARNING FLAGS</div>
    ${warnings}
  </div>` : ''}

  ${metricSections}`;
}

// ── ANALYZE ──
async function analyze(ticker){
  ticker=(ticker||document.getElementById('ti').value).trim().toUpperCase();
  if(!ticker)return;
  document.getElementById('ti').value=ticker;
  const el=document.getElementById('res');
  el.style.display='block';
  el.innerHTML=`<div class="loading"><div class="spinner"></div>Analysing ${ticker}…</div>`;
  try{
    const r=await fetch(`${API}/signal/${ticker}`);
    if(!r.ok)throw 0;
    const d=await r.json();
    el.innerHTML=renderResult(d);
  }catch{
    el.innerHTML=`<div class="err">Could not analyse ${ticker}.<br>Backend may be starting — try again in 30s.</div>`;
  }
}

// ── TOP PICKS ──
async function loadPicks(){
  const el=document.getElementById('pks');
  el.innerHTML=`<div class="loading"><div class="spinner"></div>Loading signals…</div>`;
  try{
    const r=await fetch(`${API}/top`);
    if(!r.ok)throw 0;
    const data=await r.json();
    el.innerHTML=`<div class="refresh-status">Last refresh: ${data.last_refresh?new Date(data.last_refresh).toLocaleString():'—'} · ${data.total} stocks</div>`+
    data.top.map((s,i)=>{
      const col=cc(s.conviction);
      return `<div class="pick" style="animation-delay:${i*.05}s" onclick="goAnalyze('${s.ticker}')">
        <div class="pick-stripe" style="width:${s.conviction}%;background:${cg(s.conviction)}"></div>
        <div class="pick-rank">#${i+1}</div>
        <div class="pick-info">
          <div class="pick-ticker">${s.ticker}</div>
          <div class="pick-price">$${s.price}</div>
          <div class="pick-verdict">${s.verdict}</div>
          ${s.percentile!=null?`<div class="pick-pct">Top ${100-s.percentile}% of basket</div>`:''}
        </div>
        <div class="pick-right">
          <div class="pick-cv" style="color:${col}">${s.conviction}</div>
          <div class="pick-label">CONVICTION</div>
        </div>
      </div>`;
    }).join('');
  }catch{
    el.innerHTML=`<div class="err">Failed to load picks.<br>Backend may be starting up.</div>`;
  }
}

// ── SCAN ──
async function scan(){
  const raw=document.getElementById('si').value.trim().toUpperCase();
  if(!raw)return;
  const el=document.getElementById('sout');
  el.innerHTML=`<div class="loading"><div class="spinner"></div>Scanning…</div>`;
  try{
    const r=await fetch(`${API}/scan?tickers=${encodeURIComponent(raw)}`);
    if(!r.ok)throw 0;
    const data=await r.json();
    if(!data.results.length){el.innerHTML=`<div class="err">No results.</div>`;return}
    el.innerHTML=`<div class="stable-wrap"><table>
      <thead><tr>
        <th>TICKER</th><th>PRICE</th><th>CONVICTION</th><th>VERDICT</th>
        <th>SHARPE</th><th>VOL</th><th>ENTRY</th>
      </tr></thead>
      <tbody>${data.results.map(s=>`
        <tr onclick="goAnalyze('${s.ticker}')">
          <td style="font-weight:700;color:var(--snow)">${s.ticker}</td>
          <td class="fog">$${s.price}</td>
          <td style="color:${cc(s.conviction)};font-weight:700">${s.conviction}</td>
          <td style="font-size:.65rem;color:${vs(s.verdict).col}">${s.verdict}</td>
          <td class="${s.raw.sharpe>=0?'lime':'rose'}">${s.raw.sharpe}</td>
          <td class="fog">${s.raw.vol_pct}%</td>
          <td style="font-size:.62rem;color:${ef(s.entry_flag).col}">${s.entry_flag}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
  }catch{
    el.innerHTML=`<div class="err">Scan failed. Try again.</div>`;
  }
}

// ── MANUAL REFRESH ──
async function manualRefresh(){
  const btn=document.querySelector('.refresh-btn');
  btn.textContent='REFRESHING…';
  btn.style.color='var(--lime)';
  try{
    await fetch(`${API}/refresh`,{method:'POST'});
    setTimeout(()=>{
      btn.textContent='↻ REFRESH BASKET';
      btn.style.color='';
      // reload picks if on that tab
      if(document.getElementById('pg-picks').classList.contains('on')) loadPicks();
    },3000);
  }catch{
    btn.textContent='↻ REFRESH BASKET';
    btn.style.color='';
  }
}

function goAnalyze(t){
  go('analyze');
  analyze(t);
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
