<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>fetch('https://bushwacka.onrender.com/wake').catch(()=>{});</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>WhaleWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:      #0a0a0a;
  --bg2:     #111111;
  --bg3:     #161616;
  --border:  #2a2a2a;
  --border2: #333333;
  --amber:   #ff9900;
  --amber2:  #ffb84d;
  --amber3:  #cc7700;
  --red:     #cc2200;
  --red2:    #ff4422;
  --green:   #00cc44;
  --green2:  #00ff55;
  --cyan:    #00bbcc;
  --white:   #e8e8e8;
  --gray:    #888888;
  --gray2:   #555555;
  --mono:    'IBM Plex Mono', monospace;
}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--mono);background:var(--bg);color:var(--white);font-size:12px;line-height:1.4}

/* ── HEADER ── */
header{
  background:var(--bg);
  border-bottom:1px solid var(--amber3);
  padding:0 12px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:200;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-name{font-size:13px;font-weight:700;color:var(--amber);letter-spacing:.12em}
.logo-sep{color:var(--gray2);margin:0 4px}
.logo-sub{font-size:10px;color:var(--gray);letter-spacing:.1em}
.hdr-right{display:flex;align-items:center;gap:12px}
.live-indicator{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green);letter-spacing:.08em}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 1.2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hdr-time{font-size:10px;color:var(--gray);letter-spacing:.05em}
.refresh-btn{font-size:10px;color:var(--amber);background:none;border:1px solid var(--amber3);padding:3px 8px;cursor:pointer;letter-spacing:.08em;transition:all .1s}
.refresh-btn:hover{background:var(--amber3);color:#000}

/* ── NAV ── */
nav{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;
  padding:0 12px;
  position:sticky;top:32px;z-index:199;
}
.tab{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;font-weight:500;
  color:var(--gray);background:none;border:none;cursor:pointer;
  padding:8px 14px;border-bottom:2px solid transparent;transition:all .1s;
}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.tab:hover:not(.on){color:var(--white)}

/* ── LAYOUT ── */
.pg{display:none}.pg.on{display:block}
.w{max-width:640px;margin:0 auto;padding:12px;padding-bottom:60px}

/* ── INPUT ROW ── */
.srow{display:flex;gap:6px;margin-bottom:12px}
.tinput{
  flex:1;height:32px;padding:0 10px;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  background:var(--bg2);border:1px solid var(--border2);color:var(--white);outline:none;
  transition:border-color .1s;
}
.tinput::placeholder{color:var(--gray2);font-weight:300;letter-spacing:.05em;text-transform:none}
.tinput:focus{border-color:var(--amber)}
.gbtn{
  height:32px;padding:0 16px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.15em;
  background:var(--amber);color:#000;border:none;cursor:pointer;transition:all .1s;
}
.gbtn:hover{background:var(--amber2)}

/* ── RESULT ── */
.result{display:none}

/* ── HEADER BLOCK ── */
.r-header{
  background:var(--bg2);
  border:1px solid var(--border2);
  border-left:3px solid var(--amber);
  padding:10px 12px;
  margin-bottom:6px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}
.r-ticker{font-size:22px;font-weight:700;color:var(--amber);letter-spacing:.05em;line-height:1}
.r-price{font-size:16px;color:var(--white);margin-top:4px}
.r-meta{font-size:10px;color:var(--gray);margin-top:6px;line-height:1.8}
.r-meta span{color:var(--white)}
.r-right{text-align:right}
.r-cv-label{font-size:9px;color:var(--gray);letter-spacing:.12em}
.r-cv{font-size:36px;font-weight:700;line-height:1;margin-top:2px}
.r-verdict{font-size:11px;font-weight:700;letter-spacing:.1em;margin-top:6px;padding:3px 8px;display:inline-block}

/* ── STATUS ROW ── */
.status-row{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;
}
.status-box{
  background:var(--bg2);border:1px solid var(--border);
  padding:8px 10px;
}
.sb-label{font-size:9px;color:var(--gray);letter-spacing:.1em;margin-bottom:4px}
.sb-value{font-size:11px;font-weight:600;color:var(--white)}

/* ── SECTION HEADER ── */
.sec-hd{
  font-size:9px;letter-spacing:.15em;color:var(--amber);
  padding:6px 0 4px;
  border-bottom:1px solid var(--amber3);
  margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;
}
.sec-score{font-size:13px;font-weight:700}

/* ── TABLE BLOCK ── */
.tbl-block{
  background:var(--bg2);border:1px solid var(--border);
  margin-bottom:6px;overflow:hidden;
}
.tbl-header{
  background:var(--bg3);
  border-bottom:1px solid var(--border);
  padding:6px 10px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;
  user-select:none;
}
.tbl-header:active{background:var(--border)}
.tbl-hname{font-size:9px;letter-spacing:.15em;color:var(--amber);font-weight:600}
.tbl-hscore{font-size:15px;font-weight:700}
.tbl-hchev{font-size:9px;color:var(--gray);transition:transform .2s}
.tbl-block.open .tbl-hchev{transform:rotate(180deg)}
.tbl-body{display:none}
.tbl-block.open .tbl-body{display:block}

/* ── METRIC ROW ── */
.mrow{
  display:grid;
  grid-template-columns:1fr 70px 80px 32px;
  align-items:center;
  gap:8px;
  padding:5px 10px;
  border-bottom:1px solid var(--border);
}
.mrow:last-child{border-bottom:none}
.mrow-name{font-size:10px;color:var(--gray)}
.mrow-raw{font-size:10px;color:var(--white);text-align:right}
.mbar-wrap{height:3px;background:var(--border2)}
.mbar-fill{height:100%;transition:width .6s}
.mrow-score{font-size:11px;font-weight:600;text-align:right}

/* ── CONVICTION BAR ── */
.cv-bar-row{margin:8px 0 6px}
.cv-bar-label{display:flex;justify-content:space-between;font-size:9px;color:var(--gray);margin-bottom:3px}
.cv-bar-track{height:4px;background:var(--border2)}
.cv-bar-fill{height:100%;transition:width 1s}

/* ── COPY BTN ── */
.copy-btn{
  width:100%;padding:8px;margin-bottom:6px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.15em;
  background:none;border:1px solid var(--border2);color:var(--gray);cursor:pointer;transition:all .1s;
}
.copy-btn:hover{border-color:var(--amber);color:var(--amber)}
.copy-btn.copied{border-color:var(--green);color:var(--green)}

/* ── WARNINGS ── */
.warn-block{
  background:var(--bg2);border:1px solid var(--red);border-left:3px solid var(--red);
  margin-bottom:6px;
}
.warn-header{padding:6px 10px;font-size:9px;letter-spacing:.15em;color:var(--red2)}
.warn-item{padding:5px 10px;font-size:10px;color:var(--white);border-top:1px solid var(--border);line-height:1.5}

/* ── FUNDAMENTAL BLOCK ── */
.fund-block{
  background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--cyan);
  margin-bottom:6px;padding:10px;
}
.fund-title{font-size:9px;letter-spacing:.15em;color:var(--cyan);margin-bottom:8px}
.fund-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fund-cell{background:var(--bg3);border:1px solid var(--border);padding:6px 8px}
.fund-cell-label{font-size:9px;color:var(--gray);margin-bottom:3px;letter-spacing:.08em}
.fund-cell-value{font-size:11px;font-weight:600;color:var(--white)}
.fund-cell-score{font-size:9px;margin-top:2px}

/* ── PICKS ── */
.picks-table{background:var(--bg2);border:1px solid var(--border);overflow:hidden;margin-bottom:6px}
.picks-table table{width:100%;border-collapse:collapse}
.picks-table thead th{
  font-size:9px;letter-spacing:.12em;color:var(--gray);
  padding:6px 10px;text-align:left;
  background:var(--bg3);border-bottom:1px solid var(--border2);
}
.picks-table tbody tr{cursor:pointer;transition:background .1s}
.picks-table tbody tr:hover td{background:rgba(255,153,0,.04)}
.picks-table tbody td{
  padding:7px 10px;font-size:11px;
  border-bottom:1px solid var(--border);
}
.picks-table tbody tr:last-child td{border-bottom:none}

/* ── BATCH CONTROLS ── */
.batch-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;gap:8px;
}
.batch-name{
  font-size:10px;color:var(--amber);letter-spacing:.12em;font-weight:600;flex:1;
}
.batch-dots{display:flex;gap:4px;align-items:center}
.batch-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--border2);border:1px solid var(--gray2);
  transition:all .2s;
}
.batch-dot.active{background:var(--amber);border-color:var(--amber)}
.rotate-btn{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;
  background:none;border:1px solid var(--amber3);color:var(--amber);
  padding:4px 10px;cursor:pointer;transition:all .1s;white-space:nowrap;
}
.rotate-btn:hover{background:var(--amber3);color:#000}
.rotate-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── SCAN ── */
.sinput{
  width:100%;height:32px;padding:0 10px;margin-bottom:6px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--bg2);border:1px solid var(--border2);color:var(--white);outline:none;
  transition:border-color .1s;
}
.sinput::placeholder{color:var(--gray2);text-transform:none;letter-spacing:0}
.sinput:focus{border-color:var(--cyan)}
.sbtn{
  width:100%;height:32px;margin-bottom:12px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.15em;
  background:var(--cyan);color:#000;border:none;cursor:pointer;transition:all .1s;
}
.sbtn:hover{opacity:.85}

/* ── LOADING / ERROR ── */
.loading{padding:32px;text-align:center;font-size:10px;color:var(--gray);letter-spacing:.1em}
.spinner{
  width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--amber);
  border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 10px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.err{padding:20px;text-align:center;font-size:10px;color:var(--red2);letter-spacing:.05em;line-height:1.8}

/* ── UTILITY ── */
.amber{color:var(--amber)}
.green{color:var(--green)}
.red{color:var(--red2)}
.cyan{color:var(--cyan)}
.gray{color:var(--gray)}
.white{color:var(--white)}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-name">WHALEWATCH</span>
    <span class="logo-sep">|</span>
    <span class="logo-sub">PURE QUANT ENGINE</span>
  </div>
  <div class="hdr-right">
    <button class="refresh-btn" onclick="manualRefresh()">REFRESH BASKET</button>
    <div class="live-indicator"><div class="live-dot"></div>LIVE</div>
    <div class="hdr-time" id="clock"></div>
  </div>
</header>

<nav>
  <button class="tab on" onclick="go('analyze')">ANALYZE</button>
  <button class="tab"    onclick="go('picks')">TOP PICKS</button>
  <button class="tab"    onclick="go('scan')">SCAN</button>
</nav>

<div class="pg on" id="pg-analyze">
  <div class="w">
    <div class="srow">
      <input class="tinput" id="ti" placeholder="Enter ticker…" maxlength="10"
             onkeypress="if(event.key==='Enter')analyze()">
      <button class="gbtn" onclick="analyze()">ANALYZE</button>
    </div>
    <div class="result" id="res"></div>
  </div>
</div>

<div class="pg" id="pg-picks">
  <div class="w">
    <div id="pks"><div class="loading"><div class="spinner"></div>LOADING SIGNALS…</div></div>
  </div>
</div>

<div class="pg" id="pg-scan">
  <div class="w">
    <div class="sec-hd" style="margin-bottom:8px">BULK SCANNER</div>
    <input class="sinput" id="si" placeholder="NVDA, TSLA, AAPL, RKLB…"
           onkeypress="if(event.key==='Enter')scan()">
    <button class="sbtn" onclick="scan()">RUN SCAN</button>
    <div id="sout"></div>
  </div>
</div>

<script>
const API = 'http://91.107.222.234:8000';
let lastData    = null;
let currentBatch = 0;
const TOTAL_BATCHES = 5;
const BATCH_NAMES = [
  'TECHNOLOGY',
  'FINANCIALS & HEALTHCARE',
  'ENERGY & INDUSTRIALS',
  'CONSUMER & COMMS',
  'WILDCARDS',
];

// ── CLOCK ──────────────────────────────────────────────────────────────────
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ── NAV ────────────────────────────────────────────────────────────────────
function go(t){
  ['analyze','picks','scan'].forEach((id,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('on', id===t);
    document.getElementById('pg-'+id).classList.toggle('on', id===t);
  });
  if(t==='picks' && !document.querySelector('.picks-table')) loadPicks(currentBatch);
}

// ── COLOR HELPERS ──────────────────────────────────────────────────────────
function cvColor(c){
  if(c>=80) return 'var(--green)';
  if(c>=65) return 'var(--amber)';
  if(c>=45) return 'var(--white)';
  if(c>=30) return 'var(--red2)';
  return 'var(--red)';
}
function scColor(s){
  if(s>=8) return 'var(--green)';
  if(s>=6) return 'var(--amber2)';
  if(s>=4) return 'var(--white)';
  if(s>=2) return 'var(--red2)';
  return 'var(--red)';
}
function verdictStyle(v){
  const m = {
    'Strong Buy':  {bg:'rgba(0,204,68,.12)',  border:'rgba(0,204,68,.4)',  col:'var(--green)'},
    'Buy':         {bg:'rgba(255,153,0,.1)',  border:'rgba(255,153,0,.4)', col:'var(--amber)'},
    'Neutral':     {bg:'rgba(232,232,232,.06)',border:'rgba(232,232,232,.2)',col:'var(--white)'},
    'Sell':        {bg:'rgba(204,34,0,.1)',   border:'rgba(204,34,0,.4)',  col:'var(--red2)'},
    'Strong Sell': {bg:'rgba(204,34,0,.15)',  border:'rgba(204,34,0,.5)',  col:'var(--red)'},
  };
  return m[v] || m['Neutral'];
}
function entryStyle(f){
  if(f==='Good Entry')        return {col:'var(--green)',  label:'▶ GOOD ENTRY'};
  if(f==='Wait for Pullback') return {col:'var(--amber)',  label:'◆ WAIT FOR PULLBACK'};
  return                             {col:'var(--cyan)',   label:'↑ OVERSOLD BOUNCE'};
}
function sgn(n){return n>=0?'+':''}

// ── RAW VALUE MAP ──────────────────────────────────────────────────────────
function rawMap(r){
  return {
    'RSI':               r.rsi+'',
    'MACD':              r.macd_hist+'',
    'Rate of Change':    r.roc_pct+'%',
    'OBV Trend':         r.obv_dir || '—',
    '20d Momentum':      r.mom_20d_pct+'%',
    'vs MA50':           '$'+r.ma50,
    'vs MA200':          '$'+r.ma200,
    'MA Cross':          r.ma50 > r.ma200 ? 'Golden' : 'Death',
    'ADX Strength':      r.adx+'',
    '52w Range':         '$'+r['52w_low']+'–$'+r['52w_high'],
    'Sharpe (1yr)':      r.sharpe+'',
    'Sortino (1yr)':     r.sortino+'',
    'Volatility':        r.vol_pct+'%',
    'Beta vs SPY':       r.beta+'',
    'Short Interest':    r.short_pct!=null ? r.short_pct+'%' : '—',
    'Alpha 3m':          sgn(r.alpha_3m)+r.alpha_3m+'%',
    'Alpha 6m':          sgn(r.alpha_6m)+r.alpha_6m+'%',
    'Alpha 1yr':         sgn(r.alpha_1y)+r.alpha_1y+'%',
    'Excess Consistency':'—',
    'Win Rate vs SPY':   r.win_rate+'%',
    'Fwd P/E vs Sector': r.fwd_pe!=null ? r.fwd_pe+'x (med '+r.sector_pe_median+'x)' : '—',
    'Analyst Consensus': r.rec_key ? r.rec_key.toUpperCase()+' ('+r.rec_mean+')' : '—',
    'Sector Alpha 3m':   r.alpha_vs_sector!=null ? sgn(r.alpha_vs_sector)+r.alpha_vs_sector+'% vs '+(r.sector_etf||'ETF') : '—',
  };
}

// ── METRIC TABLE BLOCK ─────────────────────────────────────────────────────
function metricBlock(name, score, metrics, raws, openByDefault){
  const rm = rawMap(raws);
  const rows = Object.entries(metrics).map(([k,v])=>
    '<div class="mrow">'+
      '<div class="mrow-name">'+k+'</div>'+
      '<div class="mrow-raw">'+(rm[k]||'—')+'</div>'+
      '<div class="mbar-wrap"><div class="mbar-fill" style="width:'+v*10+'%;background:'+scColor(v)+'"></div></div>'+
      '<div class="mrow-score" style="color:'+scColor(v)+'">'+v+'</div>'+
    '</div>'
  ).join('');

  return '<div class="tbl-block'+(openByDefault?' open':'')+'">'+
    '<div class="tbl-header" onclick="this.closest(\'.tbl-block\').classList.toggle(\'open\')">'+
      '<span class="tbl-hname">'+name+'</span>'+
      '<span class="tbl-hscore" style="color:'+cvColor(score)+'">'+score+'</span>'+
      '<span class="tbl-hchev">▾</span>'+
    '</div>'+
    '<div class="tbl-body">'+rows+'</div>'+
  '</div>';
}

// ── FUNDAMENTAL BLOCK ──────────────────────────────────────────────────────
function fundamentalBlock(d){
  const r  = d.raw;
  const fs = d.fundamental_score;
  const cells = [
    {
      label:'FWD P/E VS SECTOR',
      value: r.fwd_pe!=null ? r.fwd_pe+'x' : 'N/A',
      sub:   r.fwd_pe!=null ? 'Median: '+r.sector_pe_median+'x' : '—',
      score: d.metrics['Fundamental']['Fwd P/E vs Sector'],
    },
    {
      label:'ANALYST CONSENSUS',
      value: r.rec_key ? r.rec_key.toUpperCase() : 'N/A',
      sub:   r.rec_mean ? r.rec_mean+'/5.0 ('+r.num_analysts+' analysts)' : '—',
      score: d.metrics['Fundamental']['Analyst Consensus'],
    },
    {
      label:'SECTOR ALPHA 3M',
      value: r.alpha_vs_sector!=null ? (r.alpha_vs_sector>=0?'+':'')+r.alpha_vs_sector+'%' : 'N/A',
      sub:   r.sector_etf ? 'vs '+r.sector_etf : '—',
      score: d.metrics['Fundamental']['Sector Alpha 3m'],
    },
  ];

  return '<div class="fund-block">'+
    '<div class="fund-title">FUNDAMENTAL OVERLAY  <span style="color:var(--white);font-size:12px;font-weight:700">'+fs+'</span></div>'+
    '<div class="fund-grid">'+
    cells.map(c=>
      '<div class="fund-cell">'+
        '<div class="fund-cell-label">'+c.label+'</div>'+
        '<div class="fund-cell-value">'+c.value+'</div>'+
        '<div class="fund-cell-score" style="color:'+scColor(c.score)+'">'+c.sub+'</div>'+
      '</div>'
    ).join('')+
    '</div></div>';
}

// ── RENDER RESULT ──────────────────────────────────────────────────────────
function renderResult(d){
  lastData = d;
  const col  = cvColor(d.conviction);
  const vst  = verdictStyle(d.verdict);
  const efs  = entryStyle(d.entry_flag);
  const sz   = d.position_size || {};
  const szCol= sz.pct > 0 ? 'var(--green)' : 'var(--gray)';

  const warns = (d.warnings||[]).length
    ? '<div class="warn-block">'+
        '<div class="warn-header">WARNING FLAGS</div>'+
        (d.warnings||[]).map(w=>'<div class="warn-item">⚠ '+w+'</div>').join('')+
      '</div>'
    : '';

  const cats = [
    {name:'MOMENTUM',          score:d.momentum_score,    key:'Momentum'},
    {name:'TREND',             score:d.trend_score,       key:'Trend'},
    {name:'RISK',              score:d.risk_score,        key:'Risk'},
    {name:'RELATIVE STRENGTH', score:d.rs_score,          key:'Relative Strength'},
  ];

  return (
    '<div class="r-header">'+
      '<div>'+
        '<div class="r-ticker">'+d.ticker+'</div>'+
        '<div class="r-price">$'+d.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</div>'+
        '<div class="r-meta">'+
          'SECTOR: <span>'+(d.sector||'—')+'</span>  ·  '+
          'EARNINGS: <span>'+(d.earnings_date||'—')+'</span><br>'+
          'DATA AS OF: <span>'+(d.data_as_of||'—')+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="r-right">'+
        '<div class="r-cv-label">CONVICTION</div>'+
        '<div class="r-cv" style="color:'+col+'">'+d.conviction+'</div>'+
        '<div class="r-verdict" style="background:'+vst.bg+';border:1px solid '+vst.border+';color:'+vst.col+'">'+d.verdict.toUpperCase()+'</div>'+
      '</div>'+
    '</div>'+

    '<div class="cv-bar-row">'+
      '<div class="cv-bar-label"><span>0</span><span>CONVICTION</span><span>100</span></div>'+
      '<div class="cv-bar-track"><div class="cv-bar-fill" style="width:'+d.conviction+'%;background:'+col+'"></div></div>'+
    '</div>'+

    '<div class="status-row">'+
      '<div class="status-box">'+
        '<div class="sb-label">ENTRY SIGNAL</div>'+
        '<div class="sb-value" style="color:'+efs.col+'">'+efs.label+'</div>'+
      '</div>'+
      '<div class="status-box">'+
        '<div class="sb-label">POSITION SIZE</div>'+
        '<div class="sb-value" style="color:'+szCol+'">'+(sz.label||'—').toUpperCase()+'</div>'+
      '</div>'+
    '</div>'+

    '<button class="copy-btn" onclick="copyReport()">COPY FULL REPORT FOR AI OVERLAY</button>'+

    warns +

    cats.map((c,i)=>metricBlock(c.name, c.score, d.metrics[c.key]||{}, d.raw, i===0)).join('')+

    fundamentalBlock(d)
  );
}

// ── BUILD REPORT TEXT ──────────────────────────────────────────────────────
function buildReport(d){
  const r   = d.raw;
  const sz  = d.position_size || {};
  const rm  = rawMap(r);
  const line= '════════════════════════════════════════════';

  const rows = (metrics) => Object.entries(metrics).map(([k,v])=>
    '  '+k.padEnd(24)+(rm[k]||'—').padStart(18)+'   → '+v+'/10'
  ).join('\n');

  return [
    'WHALEWATCH QUANT REPORT — '+d.ticker+' — '+d.data_as_of,
    line,
    'SECTOR: '+(d.sector||'Unknown')+'   |   EARNINGS DATE: '+(d.earnings_date||'Unknown'),
    'PRICE: $'+d.price+'   |   DATA AS OF PREVIOUS CLOSE: '+d.data_as_of,
    '',
    'CONVICTION: '+d.conviction+'/100   |   VERDICT: '+d.verdict,
    'ENTRY FLAG: '+d.entry_flag+'   |   POSITION SIZE: '+(sz.label||'—'),
    '',
    'CATEGORY SCORES',
    '  Momentum:            '+d.momentum_score+'/100',
    '  Trend:               '+d.trend_score+'/100',
    '  Risk:                '+d.risk_score+'/100  (Max Drawdown excluded — context: '+r.max_dd_pct+'%)',
    '  Relative Strength:   '+d.rs_score+'/100',
    '  Fundamental Overlay: '+(d.fundamental_score||'—')+'/100',
    '',
    'MOMENTUM METRICS',
    rows(d.metrics['Momentum']||{}),
    '',
    'TREND METRICS',
    rows(d.metrics['Trend']||{}),
    '',
    'RISK METRICS',
    rows(d.metrics['Risk']||{}),
    '  Max Drawdown (context only, not scored)          '+r.max_dd_pct+'%',
    '',
    'RELATIVE STRENGTH METRICS',
    rows(d.metrics['Relative Strength']||{}),
    '',
    'FUNDAMENTAL OVERLAY',
    rows(d.metrics['Fundamental']||{}),
    '  Fwd P/E:             '+(r.fwd_pe!=null ? r.fwd_pe+'x (sector median: '+r.sector_pe_median+'x)' : 'N/A'),
    '  Analyst Consensus:   '+(r.rec_key ? r.rec_key.toUpperCase()+' ('+r.rec_mean+'/5.0, '+r.num_analysts+' analysts)' : 'N/A'),
    '  Short Interest:      '+(r.short_pct!=null ? r.short_pct+'% of float' : 'N/A'),
    '  Sector Alpha 3m:     '+(r.alpha_vs_sector!=null ? (r.alpha_vs_sector>=0?'+':'')+r.alpha_vs_sector+'% vs '+(r.sector_etf||'sector ETF') : 'N/A'),
    '',
    (d.warnings&&d.warnings.length) ? 'WARNING FLAGS\n'+d.warnings.map(w=>'  ⚠ '+w).join('\n') : null,
    '',
    line,
    'Generated by WhaleWatch Pure Quant Engine v2',
    'Price/volume signals + fundamental overlay (5% weight).',
    'RSI overbought is a score penalty only — not a hard filter.',
  ].filter(x=>x!==null).join('\n');
}

// ── COPY ───────────────────────────────────────────────────────────────────
async function copyReport(){
  if(!lastData) return;
  try{
    await navigator.clipboard.writeText(buildReport(lastData));
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ COPIED';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='COPY FULL REPORT FOR AI OVERLAY';btn.classList.remove('copied')}, 2500);
  }catch{ alert('Copy failed — please copy manually.'); }
}

// ── ANALYZE ────────────────────────────────────────────────────────────────
async function analyze(ticker){
  ticker = (ticker || document.getElementById('ti').value).trim().toUpperCase();
  if(!ticker) return;
  document.getElementById('ti').value = ticker;
  const el = document.getElementById('res');
  el.style.display = 'block';
  el.innerHTML = '<div class="loading"><div class="spinner"></div>ANALYSING '+ticker+'…</div>';
  try{
    const r = await fetch(API+'/signal/'+ticker);
    if(!r.ok) throw 0;
    const d = await r.json();
    el.innerHTML = renderResult(d);
  }catch{
    el.innerHTML = '<div class="err">COULD NOT ANALYSE '+ticker+'.<br>Backend may be starting — try again in 30s.</div>';
  }
}

// ── PICKS ──────────────────────────────────────────────────────────────────
function renderBatchBar(batchIndex, batchName){
  const dots = Array.from({length:TOTAL_BATCHES},(_,i)=>
    '<div class="batch-dot'+(i===batchIndex?' active':'')+'"></div>'
  ).join('');

  return '<div class="batch-bar">'+
    '<span class="batch-name">'+batchName+'</span>'+
    '<div class="batch-dots">'+dots+'</div>'+
    '<button class="rotate-btn" id="rotate-btn" onclick="rotateBatch()">NEXT SECTOR ›</button>'+
  '</div>';
}

async function loadPicks(batch, isRetry=false){
  batch = batch ?? currentBatch;
  const el = document.getElementById("pks");
  const rotBtn = document.getElementById("rotate-btn");
  if(rotBtn) rotBtn.disabled = true;

  el.innerHTML = isRetry
    ? '<div class="loading"><div class="spinner"></div>BACKEND WAKING UP — RETRYING IN 10s…</div>'
    : '<div class="loading"><div class="spinner"></div>SCANNING '+BATCH_NAMES[batch]+'…</div>';

  try{
    const r    = await fetch(API+"/top?batch="+batch);
    if(!r.ok) throw 0;
    const data = await r.json();

    currentBatch = data.batch ?? batch;

    const rows = (data.results||[]).map((s,i)=>{
      const col = cvColor(s.conviction);
      const vst = verdictStyle(s.verdict);
      const efs = entryStyle(s.entry_flag);
      return '<tr onclick="goAnalyze(\''+s.ticker+'\'")>'+
        '<td class="gray">#'+(i+1)+'</td>'+
        '<td style="font-weight:700;color:'+col+'">'+s.ticker+'</td>'+
        '<td>$'+s.price+'</td>'+
        '<td style="color:'+col+';font-weight:700">'+s.conviction+'</td>'+
        '<td style="color:'+vst.col+'">'+s.verdict+'</td>'+
        '<td style="color:'+efs.col+';font-size:10px">'+s.entry_flag+'</td>'+
        '<td class="gray" style="font-size:10px">'+(s.sector||"—")+'</td>'+
      '</tr>';
    }).join("");

    el.innerHTML =
      renderBatchBar(currentBatch, data.batch_name || BATCH_NAMES[currentBatch])+
      '<div class="picks-table"><table>'+
      '<thead><tr><th>#</th><th>TICKER</th><th>PRICE</th><th>CONV</th><th>VERDICT</th><th>ENTRY</th><th>SECTOR</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>';

  }catch{
    if(!isRetry){
      setTimeout(()=>loadPicks(batch, true), 10000);
      el.innerHTML = '<div class="err">BACKEND STARTING UP…<br>Auto-retrying in 10 seconds.</div>';
    } else {
      el.innerHTML =
        renderBatchBar(currentBatch, BATCH_NAMES[currentBatch])+
        '<div class="err">FAILED TO LOAD PICKS.<br>Try refreshing or wait 30s.</div>';
    }
  }
}

async function rotateBatch(){
  currentBatch = (currentBatch + 1) % TOTAL_BATCHES;
  await loadPicks(currentBatch);
}

// ── SCAN ───────────────────────────────────────────────────────────────────
async function scan(){
  const raw = document.getElementById('si').value.trim().toUpperCase();
  if(!raw) return;
  const el = document.getElementById('sout');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>SCANNING…</div>';
  try{
    const r    = await fetch(API+'/scan?tickers='+encodeURIComponent(raw));
    if(!r.ok) throw 0;
    const data = await r.json();
    if(!data.results.length){ el.innerHTML='<div class="err">NO RESULTS.</div>'; return; }

    const rows = data.results.map(s=>{
      const col = cvColor(s.conviction);
      const vst = verdictStyle(s.verdict);
      const efs = entryStyle(s.entry_flag);
      const sz  = s.position_size || {};
      return '<tr onclick="goAnalyze(\''+s.ticker+'\')">'+
        '<td style="font-weight:700">'+s.ticker+'</td>'+
        '<td>$'+s.price+'</td>'+
        '<td style="color:'+col+';font-weight:700">'+s.conviction+'</td>'+
        '<td style="color:'+vst.col+'">'+s.verdict+'</td>'+
        '<td style="color:'+efs.col+';font-size:10px">'+s.entry_flag+'</td>'+
        '<td style="color:'+(sz.pct>0?'var(--green)':'var(--gray)')+'">'+
          (sz.pct>0 ? sz.pct+'%' : '—')+'</td>'+
      '</tr>';
    }).join('');

    el.innerHTML =
      '<div class="picks-table">'+
        '<table>'+
          '<thead><tr>'+
            '<th>TICKER</th><th>PRICE</th><th>CONV</th><th>VERDICT</th><th>ENTRY</th><th>SIZE</th>'+
          '</tr></thead>'+
          '<tbody>'+rows+'</tbody>'+
        '</table>'+
      '</div>';
  }catch{
    el.innerHTML = '<div class="err">SCAN FAILED. TRY AGAIN.</div>';
  }
}

// ── MANUAL REFRESH ─────────────────────────────────────────────────────────
async function manualRefresh(){
  const btn = document.querySelector('.refresh-btn');
  btn.textContent = 'REFRESHING…';
  try{
    await fetch(API+'/wake');
    setTimeout(()=>{
      btn.textContent = 'REFRESH BASKET';
      if(document.getElementById('pg-picks').classList.contains('on')) loadPicks(currentBatch);
    }, 2000);
  }catch{ btn.textContent = 'REFRESH BASKET'; }
}

function goAnalyze(t){
  go('analyze');
  analyze(t);
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
